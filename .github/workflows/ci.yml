name: Repository validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/write-wrangler-config.mjs --check
      - run: npx wrangler deploy --dry-run --config .wrangler/deploy.jsonc --outdir .wrangler/dry-run
